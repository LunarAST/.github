# ─────────────────────────────────────────────
# LunarAST v3.0 Nginx Configuration Template
# Replace $lunar_domain and $lunar_backend before use.
# For the secure log format, add the following to your main nginx.conf
# inside the http {} block:
#
#   log_format secure '$remote_addr - $remote_user [$time_local] '
#                     '"$request_method $uri_no_token $server_protocol" '
#                     '$status $body_bytes_sent "$http_referer"';
# ─────────────────────────────────────────────

limit_req_zone $binary_remote_addr zone=sensitive:10m rate=5r/s;

map $request_uri $uri_no_token {
    ~^(/t/)[^/]+(/.*)$  "$1[REDACTED]$2";
    default             $request_uri;
}

server {
    listen 80;
    server_name $lunar_domain;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name $lunar_domain;

    ssl_certificate     /etc/nginx/ssl/$lunar_domain.pem;
    ssl_certificate_key /etc/nginx/ssl/$lunar_domain.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50m;

    access_log /var/log/nginx/lunar_access.log secure;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ~ ^/(login|dispatch|setup|token/generate) {
        limit_req zone=sensitive burst=3 nodelay;
        proxy_pass http://$lunar_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        keepalive_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://$lunar_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        keepalive_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
