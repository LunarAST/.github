name: Bug Report
description: Report a bug in specifications, schemas, or tooling
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in the LunarAST ecosystem. Please fill out the following information to help us diagnose and resolve the issue.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the LunarAST ecosystem does this bug affect?
      options:
        - Mother Specification (ecosystem-whitepaper)
        - RouteAST Sub-Protocol
        - lunar CLI
        - lunar-gateway
        - lunar-scope
        - JSON Schemas (schemas/)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of the affected component are you using?
      placeholder: "e.g., v0.6.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions to reproduce the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any relevant logs (stderr output, CI logs) or screenshots.
      render: shell
