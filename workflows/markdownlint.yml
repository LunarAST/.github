name: Lint Markdown

on:
  pull_request:
    paths:
      - "**.md"

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g markdownlint-cli
      - name: Lint markdown files
        run: markdownlint "**/*.md" --ignore node_modules
